name: Sync Midnight Garage
on:
  push:
    paths: ['.github/workflows/sync-garage.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the garage from Wix
        run: |
          set -e
          G=https://headless-pupedbciadr-seanloria07-140b.wix-site-host.com
          rm -rf cars thanks style.css quote.js
          curl -fsSL "$G/index.html" -o index.html
          mkdir -p assets models
          grep -oE '(assets|models)/[A-Za-z0-9._-]+\.(webp|png|glb)' index.html | sort -u > /tmp/files.txt
          for m in c300 c8 f488 gt3rs huracan-evo-spyder mclaren-570s urus; do echo "models/$m.glb" >> /tmp/files.txt; done
          sort -u /tmp/files.txt | while read f; do curl -fsSL "$G/$f" -o "$f"; done
          sed -i -E 's#<script id="wix-site-script"[^>]*></script>##' index.html
          sed -i -E "s#([\"'(])(assets|models)/#\1/\2/#g" index.html
          sed -i 's#<title>Midnight Garage</title>#<title>Midnight Auto Exotics | Exotic Car Rentals in Miami</title>#' index.html
          while read id slug name; do
            mkdir -p "cars/$slug"
            sed -e "s#<head>#<head><script>if(!/car=/.test(location.hash))history.replaceState(null,'','\#car=$id')</script>#" \
                -e "s#<title>[^<]*</title>#<title>Rent the ${name//_/ } in Miami | Midnight Auto Exotics</title>#" index.html > "cars/$slug/index.html"
          done <<'CARS'
          huracan lamborghini-huracan-evo-spyder Lamborghini_Huracán_EVO_Spyder
          f488 ferrari-488-gtb Ferrari_488_GTB
          mclaren mclaren-570s McLaren_570S
          gt3rs porsche-911-gt3-rs Porsche_911_GT3_RS
          urus lamborghini-urus Lamborghini_Urus
          c8 chevrolet-corvette-c8 Chevrolet_Corvette_C8
          c300 mercedes-benz-c300-amg Mercedes-Benz_C300_AMG
          CARS
          ls -la . models | head -40
          du -sh assets models
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Put the Midnight Garage 3D site on fleet.midnightautoexotics.com" || exit 0
          git push
